<header class="app-header">
  <a class="brand" routerLink="/projects">TaskFlow</a>

  @if (currentUser$ | async; as user) {
    <nav class="app-nav">
      <a routerLink="/projects">Proyectos</a>
    </nav>
    <div class="app-user">
      <span>{{ user.name }}</span>
      <button type="button" class="secondary" (click)="logout()">Salir</button>
    </div>
  }
</header>

<main class="app-main">
  <router-outlet />
</main>
