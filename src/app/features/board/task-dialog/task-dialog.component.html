<div class="dialog-backdrop" (click)="close.emit()">
  <form class="dialog-card" [formGroup]="form" (ngSubmit)="submit()" (click)="$event.stopPropagation()">
    <h3>{{ task ? 'Editar tarea' : 'Nueva tarea' }}</h3>

    <label for="title">Titulo</label>
    <input id="title" type="text" formControlName="title" placeholder="ej: Maquetar login" />

    <label for="description">Descripcion</label>
    <textarea id="description" formControlName="description" rows="3" placeholder="Detalle opcional"></textarea>

    <label for="assignee">Responsable</label>
    <input id="assignee" type="text" formControlName="assignee" placeholder="ej: Ana" />

    <label for="status">Columna</label>
    <select id="status" formControlName="status">
      @for (status of statuses; track status) {
        <option [value]="status">{{ statusLabel(status) }}</option>
      }
    </select>

    <div class="dialog-actions">
      <button type="submit" [disabled]="form.invalid">Guardar</button>
      <button type="button" class="secondary" (click)="close.emit()">Cancelar</button>
    </div>
  </form>
</div>
